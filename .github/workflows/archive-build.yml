name: 'Archive Build'

on:
  workflow_call:
    inputs:
      versions:
        description: 'List of versions. For example: ["95.0.1020.40-1", "114.0.1823.82-1"]'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      versions:
        description: 'List of versions. For example: ["95.0.1020.40-1", "114.0.1823.82-1"]'
        required: true
        type: string

permissions: write-all

jobs:
  archive-build:
    # Run each architecture on a native runner so the deb is fetched and
    # validated on matching hardware (amd64 on x86_64, arm64 on aarch64).
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version: ${{ fromJSON(github.event.inputs.versions) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check if this architecture was archived already
        id: check_asset
        run: |
          ASSET="google-chrome-stable_${{ matrix.version }}_${{ matrix.arch }}.deb"
          if gh release view "${{ matrix.version }}" \
               --repo "${{ github.repository }}" \
               --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "${ASSET}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download package
        id: download
        if: steps.check_asset.outputs.exists == 'false'
        run: |
          URL="https://mirror.cs.uchicago.edu/google-chrome/pool/main/g/google-chrome-stable/google-chrome-stable_${{ matrix.version }}_${{ matrix.arch }}.deb"
          if wget -q --tries=3 "${URL}"; then
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
          else
            # Older Chrome releases ship amd64 only; skip when no arm64 build exists.
            echo "downloaded=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ${{ matrix.arch }} package for ${{ matrix.version }}, skipping."
          fi
      - name: Archive build as GH release
        if: steps.download.outputs.downloaded == 'true'
        uses: softprops/action-gh-release@master
        with:
          files: |
            google-chrome-stable_${{ matrix.version }}_${{ matrix.arch }}.deb
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ matrix.version }}
          name: ${{ matrix.version }}
          body: ${{ matrix.version }}
          draft: false
          prerelease: false
