name: 'Fetch Latest Version'

on:
  workflow_dispatch:
    inputs:
      update-existing-release:
        description: 'Force update an existing release'
        required: false
        default: 'false'
  schedule:
    - cron: '0 0 * * *'

permissions: write-all

jobs:
  fetch-latest:
    runs-on: ubuntu-latest
    outputs:
      latest_version: ${{ steps.fetch.outputs.latest_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install dependencies
        run: |
          make install_dependencies
      - name: Fetch APT repository
        id: fetch
        run: |
          curl -fSsL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor | sudo tee /usr/share/keyrings/google-chrome.gpg >> /dev/null
          echo deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          LATEST_VERSION="$(apt-cache policy google-chrome-stable | grep Candidate | awk '{print $2}')"
          echo "LATEST_VERSION=${LATEST_VERSION}" >> $GITHUB_ENV
          echo "latest_version=${LATEST_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Update matrix file
        run: |
          python3 scripts/update_latest.py ${LATEST_VERSION}
      - name: Commit changes
        run: |
          git config --local user.email "NDViet-CI@users.noreply.github.com"
          git config --local user.name "Happy TestOps Robot"
          git commit -m "[ci] Update version ${LATEST_VERSION}" -m "[skip test]" -a || true
          git pull --rebase
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.ORG_CI_TOKEN }}

  archive:
    needs: fetch-latest
    # Fetch, test and archive each architecture on a matching native runner.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      LATEST_VERSION: ${{ needs.fetch-latest.outputs.latest_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check if this architecture was archived already
        id: check_asset
        run: |
          ASSET="google-chrome-stable_${LATEST_VERSION}_${{ matrix.arch }}.deb"
          if gh release view "${LATEST_VERSION}" \
               --repo "${{ github.repository }}" \
               --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "${ASSET}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch APT repository
        if: steps.check_asset.outputs.exists == 'false' ||
            github.event.inputs.update-existing-release == 'true'
        run: |
          curl -fSsL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor | sudo tee /usr/share/keyrings/google-chrome.gpg >> /dev/null
          echo deb [arch=${{ matrix.arch }} signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
      - name: Download deb package
        id: download
        if: steps.check_asset.outputs.exists == 'false' ||
            github.event.inputs.update-existing-release == 'true'
        run: |
          set +e
          apt download google-chrome-stable=${LATEST_VERSION}
          rc=$?
          set -e
          if [ "${rc}" -ne 0 ] || ! ls google-chrome-stable_*_${{ matrix.arch }}.deb >/dev/null 2>&1; then
            # The arm64 build of a brand new version may lag behind amd64; skip for now.
            echo "downloaded=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${{ matrix.arch }} deb for ${LATEST_VERSION} is not available yet, skipping."
            exit 0
          fi
          echo "downloaded=true" >> "$GITHUB_OUTPUT"
          ls -l google-chrome-stable_*_${{ matrix.arch }}.deb
      - name: Get metadata from DEB package
        if: steps.download.outputs.downloaded == 'true'
        run: |
          DEB_FILE=$(ls google-chrome-stable_*_${{ matrix.arch }}.deb)
          dpkg-deb -I $DEB_FILE > metadata_${{ matrix.arch }}.txt
          dpkg-deb -c $DEB_FILE > contents_${{ matrix.arch }}.txt
          sha256sum $DEB_FILE > checksums_${{ matrix.arch }}.sha256
      - name: Test deb package installation
        if: steps.download.outputs.downloaded == 'true'
        run: |
          DEB_FILE=$(ls google-chrome-stable_*_${{ matrix.arch }}.deb)
          sudo apt-get -qqy --no-install-recommends install --allow-downgrades ./$DEB_FILE
          google-chrome --version
      - name: Archive build as GH release
        if: steps.download.outputs.downloaded == 'true'
        uses: softprops/action-gh-release@master
        with:
          files: |
            google-chrome-stable_*_${{ matrix.arch }}.deb
            metadata_${{ matrix.arch }}.txt
            contents_${{ matrix.arch }}.txt
            checksums_${{ matrix.arch }}.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.LATEST_VERSION }}
          name: ${{ env.LATEST_VERSION }}
          body: ${{ env.LATEST_VERSION }}
          draft: false
          prerelease: false
